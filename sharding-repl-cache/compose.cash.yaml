services:
  cash-redis:
    image: redis:latest
    container_name: cash-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      start_period: 10s
    networks:
      - mongo-cluster

volumes:
  redis-data:

networks:
  mongo-cluster:
    external: true